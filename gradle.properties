# Tuned for a 4-core / 16GB machine that also runs Android Studio and other tools.
# 2GB for the Gradle daemon is ample for a project this size; going higher just
# steals memory from Studio. Raise only if you see OutOfMemoryError during builds.
# Metaspace was 512m and ran out once KSP, Room and Hilt annotation processors
# were all loaded in one daemon. 1g holds them with room to spare; the heap is
# still capped at 2g so Android Studio is not starved.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true

kotlin.code.style=official
